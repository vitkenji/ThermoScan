    // Navigation Handler
    function navigateTo(screenId) {
      if (!screens[screenId]) return;
      
      if (currentScreen !== screenId) {
        navHistory.push(currentScreen);
      }
      currentScreen = screenId;
      
      // Update Jump Selector Dropdown
      const selector = document.getElementById("screenSelector");
      if (selector) selector.value = screenId;

      // Render Screen Content
      const viewport = document.getElementById("canvasViewport");
      const screenObj = screens[screenId];
      viewport.innerHTML = screenObj.render();
      viewport.scrollTop = 0;

      // Handle Bottom Navigation Bar visibility
      const bottomNav = document.getElementById("bottomNavBar");
      if (screenObj.hideBottomNav || currentRole === "Admin") {
        bottomNav.classList.add("hidden");
        viewport.classList.remove("pb-20");
        viewport.classList.add("pb-6");
      } else {
        bottomNav.classList.remove("hidden");
        viewport.classList.remove("pb-6");
        viewport.classList.add("pb-20");
        updateBottomNavTabs(screenObj.activeTab);
      }

      // Handle Top Bar Title / Brand
      const brandLogo = document.getElementById("topBarBrandLogo");
      if (screenObj.title && screenId !== "SCR-01") {
        brandLogo.innerText = screenObj.title;
      } else {
        brandLogo.innerText = "ThermoScan";
      }

      // Hide or show back button on root screens
      const backBtn = document.getElementById("topBarBackBtn");
      if (screenId === "SCR-09" || screenId === "SCR-01" || screenId === "SCR-04") {
        backBtn.classList.add("opacity-30", "pointer-events-none");
      } else {
        backBtn.classList.remove("opacity-30", "pointer-events-none");
      }
    }

    // Role Switcher
    function setRole(newRole) {
      currentRole = newRole;
      const roleBadge = document.getElementById("roleBadge");
      roleBadge.innerText = newRole;

      if (newRole === "Admin") {
        roleBadge.className = "h-6 px-2 text-xs flex items-center font-semibold rounded bg-purple-100 text-purple-900 border border-purple-300";
        navigateTo("SCR-04");
      } else if (newRole === "Client") {
        roleBadge.className = "h-6 px-2 text-xs flex items-center font-semibold rounded bg-amber-100 text-amber-900 border border-amber-300";
        navigateTo("SCR-09");
      } else if (newRole === "Technician") {
        roleBadge.className = "h-6 px-2 text-xs flex items-center font-semibold rounded bg-teal-100 text-teal-900 border border-teal-300";
        navigateTo("SCR-09");
      } else {
        roleBadge.className = "h-6 px-2 text-xs flex items-center font-semibold rounded bg-sky-100 text-primary border border-sky-300";
        navigateTo("SCR-09");
      }
    }

    // Tab Highlight Tracker
    function updateBottomNavTabs(activeTab) {
      const tabs = {
        "Modules": document.getElementById("navModulesBtn"),
        "Alerts": document.getElementById("navAlertsBtn"),
        "Settings": document.getElementById("navSettingsBtn")
      };

      for (const [key, element] of Object.entries(tabs)) {
        if (!element) continue;
        if (key === activeTab) {
          element.className = "flex flex-col items-center justify-center flex-1 h-full text-primary font-bold transition-all";
        } else {
          element.className = "flex flex-col items-center justify-center flex-1 h-full text-text-muted transition-all";
        }
      }
    }

    // Back Navigation
    function historyBack() {
      if (navHistory.length > 0) {
        const prev = navHistory.pop();
        navigateTo(prev);
      } else {
        navigateTo("SCR-09");
      }
    }
