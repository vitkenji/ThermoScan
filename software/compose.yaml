services:
  db:
    image: postgres:16-alpine
    container_name: termoscan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: termoscan
      POSTGRES_PASSWORD: termoscan
      POSTGRES_DB: termoscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termoscan -d termoscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: termoscan-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://termoscan:termoscan@db:5432/termoscan?sslmode=disable
      JWT_SECRET: troque-este-segredo
      API_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: