services:
  db:
    image: postgres:16-alpine
    container_name: thermoscan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thermoscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thermoscan}
      POSTGRES_DB: ${POSTGRES_DB:-thermoscan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thermoscan} -d ${POSTGRES_DB:-thermoscan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: thermoscan-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thermoscan}:${POSTGRES_PASSWORD:-thermoscan}@db:5432/${POSTGRES_DB:-thermoscan}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo}
      API_PORT: ${API_PORT:-8080}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - "**/*_test.go"
            - "**/*.md"
            - "postman_collection.json"

volumes:
  pgdata:
